# Development stack — Mongo is NOT published to the public internet.
# Application deploy must NOT run bootstrap/migrations.

services:
  mongo:
    image: mongo:7.0.16
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-eternal}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-eternal_dev_password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-eternal_produksi_v4}
      MONGO_RS_HOST: mongo:27017
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-dev.key:/tmp/mongo-dev.key:ro
      - ./scripts/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
      - ./scripts/mongo-healthcheck.sh:/mongo-healthcheck.sh:ro
    entrypoint: ["/bin/bash", "/mongo-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/data/configdb/keyfile"]
    # Localhost-only publish for optional host tooling; not 0.0.0.0.
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      eternal:
        aliases:
          - mongo
    # Health = auth OK + PRIMARY. RS init runs on localhost inside this container
    # (cross-container mongosh to mongo:27017 was observed to hang).
    healthcheck:
      test: ["CMD-SHELL", "bash /mongo-healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 25s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      # Alias Owner: MONGO_URL / DB_NAME (tetap kompatibel MONGODB_*).
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-eternal}:${MONGO_ROOT_PASSWORD:-eternal_dev_password}@mongo:27017/${MONGO_INITDB_DATABASE:-eternal_produksi_v4}?authSource=admin&replicaSet=rs0
      DB_NAME: ${MONGO_INITDB_DATABASE:-eternal_produksi_v4}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-eternal}:${MONGO_ROOT_PASSWORD:-eternal_dev_password}@mongo:27017/${MONGO_INITDB_DATABASE:-eternal_produksi_v4}?authSource=admin&replicaSet=rs0
      MONGODB_DB: ${MONGO_INITDB_DATABASE:-eternal_produksi_v4}
      COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      CORS_ORIGINS: ""
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - eternal

  frontend:
    image: node:22-bookworm
    working_dir: /app
    command:
      [
        "bash",
        "-lc",
        "npm install --prefer-offline --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173",
      ]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_DEV_API_PROXY: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    networks:
      - eternal

networks:
  eternal:
    driver: bridge

volumes:
  mongo_data:
  frontend_node_modules:
